name: CI / CD

# Pull requests: verify only.
# Push to main: verify → deploy to GitHub Pages → publish the GitHub Release.
#
# Releasing is driven by the VERSION file: bump it, add a matching
# "## [x.y.z]" section to CHANGELOG.md, merge to main. The pipeline creates
# the tag, the release notes (from the changelog) and attaches the built site.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a deploy or release half-way on main; PR runs may be superseded.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Version
        id: version
        run: |
          npm run --silent version:check
          echo "version=$(node scripts/version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Package release build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: (cd dist && zip -qr "../sanctuary-v${{ steps.version.outputs.version }}.zip" .)

      - name: Upload release build
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: release-build
          path: sanctuary-v${{ steps.version.outputs.version }}.zip
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [verify, deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CURRENT: ${{ needs.verify.outputs.version }}
      SITE: ${{ needs.deploy.outputs.page_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-build

      # Every "## [x.y.z]" in the changelog gets a release once. Older versions are
      # released only if their tag already exists; the current one is tagged here.
      - name: Publish missing releases
        run: |
          set -euo pipefail
          versions=$(sed -nE 's/^## \[([0-9]+\.[0-9]+\.[0-9]+[^]]*)\].*/\1/p' CHANGELOG.md | tac)

          for v in $versions; do
            tag="v$v"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag: already released"
              continue
            fi

            if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              if [ "$v" != "$CURRENT" ]; then
                echo "$tag: no tag and not the current version, skipping"
                continue
              fi
              git tag "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi

            { node scripts/version.mjs notes "$v"; printf '\n---\n\n**Live:** %s\n' "$SITE"; } > notes.md

            if [ "$v" = "$CURRENT" ]; then
              gh release create "$tag" "sanctuary-$tag.zip" \
                --title "Sanctuary $tag" --notes-file notes.md --verify-tag --latest
            else
              gh release create "$tag" \
                --title "Sanctuary $tag" --notes-file notes.md --verify-tag --latest=false
            fi
            echo "$tag: released"
          done
